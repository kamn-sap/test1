<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>北海道トラベルマップ - 3D Interactive Map</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="ui">
      <div class="info-card">
        <div class="eyebrow">北海道・旅の記録</div>
        <h1 id="title">北海道へようこそ</h1>
        <p id="description">
          ひとつの地図に、北海道の食、雪、温泉、風景をまとめた旅の記録です。
        </p>
        <div id="spot-detail" class="spot-detail"></div>
        <a id="spot-link" class="spot-link" href="#" target="_blank" rel="noreferrer">公式サイトを見る</a>
      </div>

      <div class="controls">
        <button id="resetBtn" class="btn">↺ リセット</button>
        <button id="toggleThemeBtn" class="btn">🌤️ 四季</button>
      </div>

      <div class="season-controls" aria-label="季節選択">
        <button class="season-btn active" data-season="spring">春</button>
        <button class="season-btn" data-season="summer">夏</button>
        <button class="season-btn" data-season="autumn">秋</button>
        <button class="season-btn" data-season="winter">冬</button>
      </div>

      <div class="stats">
        <span id="fps">FPS: 60</span>
        <span id="marker-count">スポット: 7/7</span>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
